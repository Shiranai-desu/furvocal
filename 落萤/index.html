    <script>
        // 三语切换逻辑
        function changeLang(type) {
            // 重置按钮选中
            document.querySelectorAll('.lang-btn').forEach(btn=>{
                btn.classList.remove('active');
            })
            event.target.classList.add('active');

            // 隐藏所有语言
            document.querySelectorAll('.zh').forEach(el=>el.style.display='none');
            document.querySelectorAll('.jp').forEach(el=>el.style.display='none');
            document.querySelectorAll('.en').forEach(el=>el.style.display='none');

            // 展示对应语言
            if(type === 'zh'){
                document.querySelectorAll('.zh').forEach(el=>el.style.display='inline');
                document.title = "落萤&沫眠 虚拟歌姬声库配布";
            }
            if(type === 'jp'){
                document.querySelectorAll('.jp').forEach(el=>el.style.display='inline');
                document.title = "落螢&沫眠 音源配布";
            }
            if(type === 'en'){
                document.querySelectorAll('.en').forEach(el=>el.style.display='inline');

            }
        }
